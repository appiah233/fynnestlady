name: Production gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release PR number
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  deployments: read
  actions: read
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
  BOT_BASE_REF: main
concurrency:
  group: production-gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  production-gate:
    # The first control-plane validation is a draft until the owner enables promotion.
    if: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Resolve exact release head and successful evidence run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$BOT_PR_NUMBER")"
          base="$(jq -r '.base.ref' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
          sha="$(jq -r '.head.sha' <<< "$pr")"
          test "$base" = main && test "$head_ref" = dev && test "$head_repo" = "$GITHUB_REPOSITORY"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/evidence-publisher.yml/runs?head_sha=$sha&status=completed&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success" and .event == "pull_request")) | .[0].id')"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Check out candidate release branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Download trusted evidence for release head
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bot-evidence
          path: evidence
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify evidence head
        env:
          BOT_HEAD_SHA: ${{ steps.release.outputs.sha }}
          BOT_EVIDENCE_PATH: ${{ github.workspace }}/evidence/bot-evidence.json
        run: node -e "const e=require(process.env.BOT_EVIDENCE_PATH);if(e.headSha!==process.env.BOT_HEAD_SHA)process.exit(1)"
      - name: Require trusted production controller on main
        run: |
          if [ ! -f scripts/bot.mjs ]; then
            echo '::error::main does not yet contain the trusted production controller. Bootstrap it through a protected owner-reviewed PR before enabling promotion.'
            exit 1
          fi
      - name: Validate release evidence, migrations, preview and rollback
        env:
          BOT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BOT_TARGET_DIR: ${{ github.workspace }}/candidate
          BOT_EVIDENCE_PATH: ${{ github.workspace }}/evidence/bot-evidence.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bot.mjs production-gate
      - name: Failure summary
        if: failure()
        run: echo "::error::Release blocked by production gate. Inspect failed evidence." >> "$GITHUB_STEP_SUMMARY"
