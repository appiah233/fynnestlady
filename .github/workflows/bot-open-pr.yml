name: Bot open PR
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Implemented issue number
        required: true
        type: number
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'security/**'
      - 'chore/**'
permissions:
  contents: read
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
concurrency:
  group: bot-open-pr-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  open:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip bot]') && startsWith(github.ref_name, 'feature/') && github.ref_name != 'feature/fynnestlady-engineering-bot')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Validate branch and work
        env:
          BOT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/bot.mjs policy
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.FYNNESTLADY_APP_ID }}
          private-key: ${{ secrets.FYNNESTLADY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      - name: Create or update one PR to dev
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BOT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BOT_SOURCE_BRANCH: ${{ github.ref_name }}
        run: node scripts/bot.mjs open-pr
