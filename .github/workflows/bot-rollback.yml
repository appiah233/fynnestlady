name: Bot rollback
on:
  workflow_run:
    workflows: [Post deployment smoke]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Failed production deployment identifier
        required: true
        type: string
permissions: {}
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
concurrency:
  group: bot-rollback-${{ github.event.workflow_run.id || inputs.deployment_id }}
  cancel-in-progress: false
jobs:
  rollback:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' && vars.FYNNESTLADY_PRODUCTION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Download failed deployment context
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deployment-context
          path: deployment-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.FYNNESTLADY_APP_ID }}
          private-key: ${{ secrets.FYNNESTLADY_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-deployments: read
          permission-issues: write
          permission-pull-requests: write
      - name: Roll back failed production release and explain the recovery
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BOT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          BOT_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          BOT_DEPLOYMENT_CONTEXT_PATH: ${{ github.workspace }}/deployment-context/context.json
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
        run: node scripts/bot.mjs rollback
