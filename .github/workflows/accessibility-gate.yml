name: Accessibility gate
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to validate
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
env:
  BOT_BASE_REF: ${{ github.event.pull_request.base.ref || 'dev' }}
concurrency:
  group: accessibility-gate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true
jobs:
  accessibility-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ hashFiles('candidate/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install candidate dependencies
        if: ${{ hashFiles('candidate/package.json') != '' }}
        working-directory: candidate
        run: npm ci
      - name: Install Playwright Chromium
        if: ${{ hashFiles('candidate/package.json') != '' }}
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Validate accessibility gate
        env:
          BOT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BOT_TARGET_DIR: ${{ github.workspace }}/candidate
        run: |
          if [ -f scripts/bot.mjs ]; then
            node scripts/bot.mjs accessibility
          else
            node candidate/scripts/bot.mjs accessibility
          fi
      - name: Failure summary
        if: failure()
        run: echo "::error::Accessibility gate failed; inspect this run and the PR evidence." >> "$GITHUB_STEP_SUMMARY"
