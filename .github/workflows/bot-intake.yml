name: Bot intake
on:
  schedule:
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Work source (roadmap, failure, dependency, security)
        required: false
        default: roadmap
permissions:
  contents: read
  issues: write
  actions: write
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
concurrency:
  group: bot-intake
  cancel-in-progress: false
jobs:
  intake:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          persist-credentials: false
      - name: Mint GitHub App token (when configured)
        if: ${{ vars.FYNNESTLADY_USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ secrets.FYNNESTLADY_APP_ID }}
          private-key: ${{ secrets.FYNNESTLADY_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-actions: write
      - name: Deduplicate, budget and create eligible issue
        id: intake
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BOT_SOURCE: ${{ inputs.source || 'roadmap' }}
        run: node scripts/bot.mjs intake
      - name: Report result
        if: always()
        run: |
          echo "Intake result: ${{ steps.intake.outcome }}" >> "$GITHUB_STEP_SUMMARY"
