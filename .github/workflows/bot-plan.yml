name: Bot plan
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number
        required: true
        type: number
permissions:
  contents: read
  issues: read
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
concurrency:
  group: bot-plan-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'bot-ready')) || github.event.label.name == 'bot-ready') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Validate issue and rate budget
        env:
          BOT_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/bot.mjs policy
      - name: Fetch issue context as untrusted task data
        env:
          BOT_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          BOT_CONTEXT_PATH: ${{ github.workspace }}/.bot-task.md
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bot.mjs task-context
      - name: Gemini issue planning
        id: gemini_plan
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Follow the instructions in .github/codex/prompts/issue-planning.md to plan the eligible issue in .bot-task.md.
          settings: |
            {
              "telemetry": { "enabled": false }
            }
      - name: Write planning artifact
        env:
          GEMINI_PLAN_OUTPUT: ${{ steps.gemini_plan.outputs.gemini_response }}
        run: |
          if [ -n "$GEMINI_PLAN_OUTPUT" ]; then
            printf '%s\n' "$GEMINI_PLAN_OUTPUT" > bot-plan.txt
          fi
          test -s bot-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bot-plan-${{ github.event.issue.number || inputs.issue_number }}
          path: bot-plan.txt
          if-no-files-found: error
          retention-days: 14
  branch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a
        with:
          name: bot-plan-${{ github.event.issue.number || inputs.issue_number }}
          path: bot-plan
      - name: Require planning output
        run: test -s bot-plan/bot-plan.txt
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.FYNNESTLADY_APP_ID }}
          private-key: ${{ secrets.FYNNESTLADY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-actions: write
      - name: Create deduplicated branch from healthy dev
        id: branch
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          BOT_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/bot.mjs branch
      - name: Dispatch implementation once
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          BOT_BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_BRANCH_NAME"
          gh workflow run bot-implement.yml --ref dev -f issue_number="$BOT_ISSUE_NUMBER" -f branch_name="$BOT_BRANCH_NAME"
