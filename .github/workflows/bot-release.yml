name: Bot release
on:
  push:
    branches: [dev]
  schedule:
    - cron: '43 8 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate release preparation without promotion
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  pull-requests: write
env:
  FYNNESTLADY_BOT_ENABLED: ${{ vars.FYNNESTLADY_BOT_ENABLED }}
  FYNNESTLADY_PRODUCTION_ENABLED: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED }}
concurrency:
  group: bot-release
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' && (vars.FYNNESTLADY_PRODUCTION_ENABLED == 'true' || inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Review release and migration safety
        if: ${{ vars.FYNNESTLADY_PRODUCTION_ENABLED == 'true' && inputs.dry_run != true }}
        env:
          BOT_DRY_RUN: ${{ inputs.dry_run || vars.FYNNESTLADY_PRODUCTION_ENABLED != 'true' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bot.mjs production-gate
      - name: Validate dev for dry run
        if: ${{ inputs.dry_run == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bot.mjs dev-health
      - name: Gemini release review and notes (free tier when key configured)
        id: gemini_release
        if: ${{ vars.FYNNESTLADY_USE_GEMINI_API == 'true' }}
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Follow the instructions in .github/codex/prompts/release-review.md and produce the release review and notes.
          settings: |
            {
              "telemetry": { "enabled": false }
            }
      - name: Write release review artifact
        env:
          GEMINI_RELEASE_OUTPUT: ${{ steps.gemini_release.outputs.gemini_response }}
        run: |
          if [ -n "$GEMINI_RELEASE_OUTPUT" ]; then
            printf '%s\n' "$GEMINI_RELEASE_OUTPUT" > release-review.txt
          else
            echo "status: DRY_RUN_PASS" > release-review.txt
          fi
          test -s release-review.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-review-${{ github.run_id }}
          path: release-review.txt
          if-no-files-found: error
          retention-days: 30
  open-release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Mint GitHub App token (when configured)
        if: ${{ vars.FYNNESTLADY_USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.FYNNESTLADY_APP_ID }}
          private-key: ${{ secrets.FYNNESTLADY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release PR
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BOT_DRY_RUN: ${{ inputs.dry_run || vars.FYNNESTLADY_PRODUCTION_ENABLED != 'true' }}
        run: node scripts/bot.mjs release
