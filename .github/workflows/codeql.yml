name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        if: ${{ hashFiles('package.json') != '' }}
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          languages: javascript-typescript
      - name: Analyze
        if: ${{ hashFiles('package.json') != '' }}
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311
