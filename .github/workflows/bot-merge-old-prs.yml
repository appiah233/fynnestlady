name: Bot merge safe old PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Specific PR targeting dev (leave blank to evaluate all open PRs)'
        required: false
        type: number

permissions:
  actions: write
  pull-requests: read

jobs:
  dispatch-protected-controller:
    if: ${{ vars.FYNNESTLADY_BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send each PR through the evidence-backed merge controller
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BOT_PR_NUMBER" ]; then
            numbers="$BOT_PR_NUMBER"
          else
            numbers="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=dev&per_page=100" --jq '.[].number')"
          fi
          for number in $numbers; do
            payload="$(jq -cn --arg number "$number" '{ref: "dev", inputs: {pr_number: $number}}')"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bot-merge-dev.yml/dispatches" --method POST --input - <<< "$payload"
          done
