name: Foundation validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate foundation
        run: node scripts/validate-foundation.mjs
      - name: Detect whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check --cached

  proposed-engineering-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm test
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run build
