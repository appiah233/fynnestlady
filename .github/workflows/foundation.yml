name: Foundation validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Check out candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate foundation
        working-directory: candidate
        run: node "$GITHUB_WORKSPACE/scripts/validate-foundation.mjs"
      - name: Detect candidate whitespace errors
        working-directory: candidate
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BASE_BRANCH" ]; then
            git diff --check "origin/$BASE_BRANCH...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  proposed-engineering-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm test
      - if: ${{ hashFiles('package.json') != '' }}
        run: npm run build
