name: Secret scan

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          persist-credentials: false
      - name: Check out candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Scan candidate content with trusted scanner
        working-directory: candidate
        run: node "$GITHUB_WORKSPACE/scripts/scan-secrets.mjs"
